<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Seleksi Mahasiswa Baru POLMIND Gelombang 2</title>
    <style>
        body {
            background: #222;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .construction-icon {
            margin: 0 auto 20px auto;
            width: 100px;
            height: 100px;
            position: relative;
        }
        .crane {
            animation: swing 2s infinite ease-in-out;
            transform-origin: top center;
        }
        @keyframes swing {
            0% { transform: rotate(-10deg);}
            50% { transform: rotate(10deg);}
            100% { transform: rotate(-10deg);}
        }
        .fade-in {
            opacity: 0;
            animation: fadeIn 2s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="construction-icon">
            <!-- Simple SVG crane icon -->
            <svg class="crane" width="100" height="100" viewBox="0 0 100 100">
                <rect x="45" y="20" width="10" height="60" fill="#FFD700"/>
                <rect x="40" y="80" width="20" height="10" fill="#888"/>
                <line x1="50" y1="20" x2="80" y2="40" stroke="#FFD700" stroke-width="4"/>
                <circle cx="80" cy="40" r="6" fill="#FFD700"/>
                <rect x="77" y="46" width="6" height="18" fill="#888"/>
            </svg>
        </div>
        <h1 class="fade-in">Under Construction</h1>
        <p class="fade-in" style="animation-delay:1s;">We're working hard to launch soon!</p>
        <p>POLMIND Developer</p>
    </div>
</body>
</html>
